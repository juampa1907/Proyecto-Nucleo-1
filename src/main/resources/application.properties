spring.application.name=OrganizatorCollege

server.servlet.context-path=/CollegeAdministrator

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Los controladores convierten entidades a DTO después de que el servicio retorna y leen relaciones LAZY:
# la sesión de Hibernate debe seguir abierta durante toda la petición.
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

spring.datasource.url=jdbc:mysql://localhost:3306/college_administrator
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT: en producción definir JWT_SECRET (mínimo 32 caracteres). El valor por defecto es solo para desarrollo.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.expiracion-minutos=60

# Administrador inicial: se crea al arrancar solo si la base no tiene ningún usuario. Cambiar la contraseña tras el primer ingreso.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.correo=${ADMIN_CORREO:admin@unbosque.edu.co}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# URL del frontend, usada en el enlace de recuperación de contraseña (HU-03).
app.url-frontend=${URL_FRONTEND:http://localhost:4200}

# Notificaciones por correo (HU-03, HU-39, HU-40, HU-41). Si está en false, solo se guardan en la base de datos.
app.notificaciones.correo-habilitado=${CORREO_HABILITADO:false}
app.notificaciones.remitente=${CORREO_REMITENTE:no-reply@unbosque.edu.co}
# Hora diaria de los avisos de apertura y cierre de inscripción (HU-40).
app.avisos.cron=0 0 7 * * *

