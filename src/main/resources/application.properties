spring.application.name=OrganizatorCollege

server.servlet.context-path=/CollegeAdministrator

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

spring.datasource.url=jdbc:mysql://localhost:3306/college_administrator
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.expiracion-minutos=60


app.admin.username=${ADMIN_USERNAME:admin}
app.admin.correo=${ADMIN_CORREO:admin@unbosque.edu.co}
app.admin.password=${ADMIN_PASSWORD:Admin12345}


app.url-frontend=${URL_FRONTEND:http://localhost:4200}


app.notificaciones.correo-habilitado=${CORREO_HABILITADO:true}
app.notificaciones.remitente=${CORREO_REMITENTE:no-reply@unbosque.edu.co}
# Hora diaria de los avisos de apertura y cierre de inscripción (HU-40).
app.avisos.cron=0 0 7 * * *


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000